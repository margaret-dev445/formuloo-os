
services:

  # ───────── API GATEWAY ─────────
  kong:
    image: kong:3.4
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout

  # ───────── BASES DE DONNÉES ─────────
  postgres-hr:
    image: postgres:16
    environment:
      POSTGRES_DB: hr_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - hr_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  postgres-compta:
    image: postgres:16
    environment:
      POSTGRES_DB: compta_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - compta_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  postgres-crm:
    image: postgres:16
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - crm_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  postgres-stock:
    image: postgres:16
    environment:
      POSTGRES_DB: stock_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - stock_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

  postgres-projet:
    image: postgres:16
    environment:
      POSTGRES_DB: projet_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - projet_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"

  mongodb-reporting:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: reporting_db
    volumes:
      - reporting_data:/data/db
    ports:
      - "27017:27017"

  # ───────── MONITORING ─────────
  prometheus:
    image: prom/prometheus:v2.48.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

# ───────── MICROSERVICES ─────────
  hr-service:
    build: ../services/hr-service
    ports:
      - "3001:3000"
    depends_on:
      - postgres-hr
    environment:
      DATABASE_URL: postgres://user:password@postgres-hr:5432/hr_db
      PORT: 3000

  crm-service:
    build: ../services/crm-service
    ports:
      - "3002:3000"
    depends_on:
      - postgres-crm
    environment:
      DATABASE_URL: postgres://user:password@postgres-crm:5432/crm_db
      PORT: 3000

  stock-service:
    build: ../services/stock-service
    ports:
      - "3003:3000"
    depends_on:
      - postgres-stock
    environment:
      DATABASE_URL: postgres://user:password@postgres-stock:5432/stock_db
      PORT: 3000

  compta-service:
    build: ../services/compta-service
    ports:
      - "3004:3000"
    depends_on:
      - postgres-compta
    environment:
      DATABASE_URL: postgres://user:password@postgres-compta:5432/compta_db
      PORT: 3000

  projet-service:
    build: ../services/projet-service
    ports:
      - "3005:3000"
    depends_on:
      - postgres-projet
    environment:
      DATABASE_URL: postgres://user:password@postgres-projet:5432/projet_db
      PORT: 3000

  reporting-service:
    build: ../services/reporting-service
    ports:
      - "3006:3000"
    depends_on:
      - mongodb-reporting
    environment:
      MONGODB_URL: mongodb://mongodb-reporting:27017/reporting_db
      PORT: 3000

# ───────── AUTH SERVICE ─────────
  postgres-auth:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - auth_data:/var/lib/postgresql/data
    ports:
      - "5437:5432"

  auth-service:
    build: ../services/auth-service
    ports:
      - "3007:3000"
    depends_on:
      - postgres-auth
    environment:
      DB_HOST: postgres-auth
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: auth_db
      JWT_SECRET: formuloo-super-secret-jwt-key-2026
      PORT: 3000

# ───────── LOKI (logs) ─────────
  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3200:3100"
    volumes:
      - loki_data:/loki

  # ───────── PROMTAIL (collecte logs) ─────────
  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - /var/log:/var/log
      - ./monitoring/promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml

volumes:
  hr_data:
  compta_data:
  crm_data:
  stock_data:
  projet_data:
  reporting_data:
  grafana_data:
  auth_data:
  loki_data: