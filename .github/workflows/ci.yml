name: CI — Formuloo OS

on:
  push:
    branches: [master, develop, feature/*]
  pull_request:
    branches: [master, develop]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check project structure
        run: |
          echo "Structure du projet :"
          ls -la
          echo "Services :"
          ls services/

      - name: Validate docker-compose
        run: |
          docker compose -f infrastructure/docker-compose.yml config

      - name: Tests hr-service
        run: |
          cd services/hr-service
          npm ci
          npm run test

      - name: Tests crm-service
        run: |
          cd services/crm-service
          npm ci
          npm run test

      - name: Tests stock-service
        run: |
          cd services/stock-service
          npm ci
          npm run test

      - name: Tests compta-service
        run: |
          cd services/compta-service
          npm ci
          npm run test

      - name: Tests projet-service
        run: |
          cd services/projet-service
          npm ci
          npm run test

      - name: Tests reporting-service
        run: |
          cd services/reporting-service
          npm ci
          npm run test

      - name: Pipeline success
        run: |
          echo "✅ Tous les tests passent !"
          echo "Branche : ${{ github.ref_name }}"
          echo "Commit  : ${{ github.sha }}"