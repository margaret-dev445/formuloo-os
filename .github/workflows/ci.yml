name: CI/CD Phase 2 — Formuloo OS

on:
  push:
    branches: [master, develop, feature/*]
  pull_request:
    branches: [master, develop]

jobs:

  # ── JOB 1 : Tests unitaires + intégration ──
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check structure
        run: |
          echo "Structure :"
          ls -la
          ls services/

      - name: Validate docker-compose
        run: |
          docker compose -f infrastructure/docker-compose.yml config

      - name: Tests hr-service
        run: |
          cd services/hr-service
          npm ci
          npm run test

      - name: Tests crm-service
        run: |
          cd services/crm-service
          npm ci
          npm run test

      - name: Tests stock-service
        run: |
          cd services/stock-service
          npm ci
          npm run test

      - name: Tests compta-service
        run: |
          cd services/compta-service
          npm ci
          npm run test

      - name: Tests projet-service
        run: |
          cd services/projet-service
          npm ci
          npm run test

      - name: Tests reporting-service
        run: |
          cd services/reporting-service
          npm ci
          npm run test

      - name: Tests auth-service
        run: |
          cd services/auth-service
          npm ci
          npm run test

  # ── JOB 2 : Build Docker ──
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build hr-service
        run: |
          docker build -t formuloo/hr-service:${{ github.sha }} \
          services/hr-service

      - name: Build crm-service
        run: |
          docker build -t formuloo/crm-service:${{ github.sha }} \
          services/crm-service

      - name: Build auth-service
        run: |
          docker build -t formuloo/auth-service:${{ github.sha }} \
          services/auth-service

      - name: Pipeline success
        run: |
          echo "✅ CI/CD Phase 2 terminé !"
          echo "Branche : ${{ github.ref_name }}"
          echo "Commit  : ${{ github.sha }}"